name: Build APK

on:
  push:
    paths:
      - 'plafond-led-app.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o plafond-led-app.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: plafond-led-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp plafond-led-app/app/build/outputs/apk/debug/app-debug.apk PlafondLED.apk

      # Versie uit build.gradle, zodat de knop "Check for update" in de app kan vergelijken
      - name: Read version
        id: ver
        run: |
          echo "name=$(grep -oP "versionName '\K[^']+" plafond-led-app/app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode \K[0-9]+' plafond-led-app/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PlafondLED-apk
          path: PlafondLED.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tasmota Scan & Control ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Tasmota Scan & Control ${{ steps.ver.outputs.name }}
            versionCode: ${{ steps.ver.outputs.code }}
          files: PlafondLED.apk
          make_latest: true
