name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o plafond-led-app.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: plafond-led-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp plafond-led-app/app/build/outputs/apk/debug/app-debug.apk PlafondLED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlafondLED-apk
          path: PlafondLED.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plafond LED (build ${{ github.run_number }})
          files: PlafondLED.apk
          make_latest: true
