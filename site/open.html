<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open the app · Tasmota & Shelly Scan & Control</title>
<meta name="description" content="Opens the free Android app Tasmota & Shelly Scan & Control. Not installed yet? The button downloads it.">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1525;color:#e8e4da;
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:420px;padding:32px 22px}
  h1{font-size:1.5rem;margin:0 0 6px;color:#fff}
  p{margin:8px 0;color:#a3abbd}
  .go{display:block;margin:24px 0 12px;padding:18px;border-radius:16px;background:#3ddc84;color:#0b1a10;font-weight:800;font-size:1.2rem;text-decoration:none}
  .go:active{transform:scale(.98)}
  a.alt{color:#f0a630;font-weight:700}
  .small{font-size:.88rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Tasmota &amp; Shelly Scan &amp; Control</h1>
  <p id="txt">Opening the app…</p>
  <a class="go" id="go" href="#" hidden>Open the app</a>
  <p class="small" id="hint" hidden>Not installed yet? The button downloads the app (APK).</p>
  <p id="pc" hidden>The app is for Android phones and tablets.<br>Open this link on your Android device.</p>
  <p class="small"><a class="alt" href="./">Website, videos and demo</a></p>
</main>
<script>
  // open.html#thermostat, #tiles, #scenes or nothing (= just open the app)
  const screens = {thermostat: 'Heating screen', tiles: 'Tiles', scenes: 'Scenes'};
  const h = (location.hash || '').slice(1).toLowerCase(), host = screens[h] ? h : 'open';
  const apk = 'https://github.com/ldijkman/Tasmota-android-test/releases/latest/download/PlafondLED.apk';
  const intent = 'intent://' + host + '#Intent;scheme=tasmotascan;package=nl.dijkman.plafondled;S.browser_fallback_url=' + encodeURIComponent(apk) + ';end';
  const txt = document.getElementById('txt'), go = document.getElementById('go');
  if (/android/i.test(navigator.userAgent)) {
    go.href = intent; go.hidden = false; document.getElementById('hint').hidden = false;
    if (screens[h]) go.textContent = 'Open the app: ' + screens[h];
    txt.textContent = 'Did the app not open? Tap the button.';
    location.href = intent;   // try at once; some browsers only allow it after a tap
  } else {
    txt.hidden = true; document.getElementById('pc').hidden = false;
  }
</script>
</body>
</html>
